[project]
name = "fin-insight-graph-agent"
version = "0.1.0"
description = "Engineering foundation for Fin-Insight-Graph-Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.11.0",
  "sqlalchemy>=2.0.41",
  "alembic>=1.16.4",
  "psycopg[binary]>=3.2.9",
  "qdrant-client>=1.15.1",
  "neo4j>=5.28.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0",
  "mypy>=1.18.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_insight_graph_agent"]

[tool.uv]
default-groups = ["dev"]